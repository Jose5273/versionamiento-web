name: Sync to GitLab

on:
  push:
    branches:
      - main
      - develop
      - test

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Añadimos el remoto SIN el token
          git remote add gitlab https://gitlab.com/Jose5273/versionamiento-web.git
          
          # 2. Le decimos a Git que guarde el token en su "llave de acceso" temporal
          # (oauth2 es el usuario correcto para tokens de GitLab)
          git config --global credential.helper store
          echo "https://oauth2:${GITLAB_TOKEN}@gitlab.com" > ~/.git-credentials
          
          # 3. Hacemos el push
          git push gitlab --force --prune "refs/remotes/origin/*:refs/heads/*"
          git push gitlab --force --tags

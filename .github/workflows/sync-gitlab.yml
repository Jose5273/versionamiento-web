name: Sync to GitLab

on:
  push:
    branches:
      - main
      - develop
      - test

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear proyecto en GitLab (si no existe)
        run: |
          curl --request POST --header "PRIVATE-TOKEN: glpat-TU_TOKEN_AQUI" \
          "https://gitlab.com/api/v4/projects" \
          --data "name=versionamiento-web" || true

      - name: Push to GitLab
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          glpat-dWfRcvbuejXemhxSn3bWfGM6MQpvOjEKdTpxbTlxaA8.01.170xojhn7
          git remote add gitlab https://oauth2:glpat-TU_TOKEN_AQUI@gitlab.com/Jose5273/versionamiento-web.git
          
          git push gitlab --force --prune "refs/remotes/origin/*:refs/heads/*"
          git push gitlab --force --tags

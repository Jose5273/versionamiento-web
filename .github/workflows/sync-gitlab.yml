name: Sync to GitLab

on:
  push:
    branches:
      - main
      - develop
      - test

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          # Configuramos el remoto usando el token guardado en GitHub
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/sampedro2002/versionamiento-web.git
          
          # Empujamos todas las ramas
          git push gitlab --force --prune "refs/remotes/origin/*:refs/heads/*"
          git push gitlab --force --tags
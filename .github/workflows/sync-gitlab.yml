name: Sync to GitLab

on:
  push:
    branches:
      - main
      - develop
      - test

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Limpiamos el token (quitamos espacios y saltos de línea ocultos)
          CLEAN_TOKEN=$(echo "${{ secrets.GITLAB_TOKEN }}" | tr -d '[:space:]')
          
          # 2. Usamos el token limpio para el remoto
          git remote add gitlab https://oauth2:${CLEAN_TOKEN}@gitlab.com/Jose5273/versionamiento-web.git
          
          # 3. Hacemos el push
          git push gitlab --force --prune "refs/remotes/origin/*:refs/heads/*"
          git push gitlab --force --tags

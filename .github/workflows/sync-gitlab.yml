name: Sync to GitLab

on:
  push:
    branches:
      - main
      - develop
      - test

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          # 1. Configuramos Git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 2. Añadimos el remoto con tu token temporal
          git remote add gitlab https://oauth2:glpat-sXfNAaa1sVGkW5z3ktmF1GM6MQpvOjEKdTpxbTlxaA8.01.1700rf7mz@gitlab.com/Jose5273/versionamiento-web.git
          
          # 3. Hacemos el push de todas las ramas y tags
          git push gitlab --force --prune "refs/remotes/origin/*:refs/heads/*"
          git push gitlab --force --tags
